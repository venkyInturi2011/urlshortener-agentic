name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Orchestrator tests + coverage gate
        run: mvn -B clean verify
      - name: Reference service (greenfield output)
        run: mvn -B -f shortener-service/pom.xml verify
      - name: End-to-end scenarios with real build gates
        run: bash scripts/run-all.sh
      - name: Failure-handling demos
        run: bash scripts/chaos-demo.sh
